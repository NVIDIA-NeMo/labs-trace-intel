[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "insight-agent"
version = "0.1.0"
description = "Insight Agent IA2/IA3 trace-evidence preprocessing with a canonical JSONL trace contract"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Insight Agent contributors" }]
keywords = ["agent-traces", "evaluation", "anomaly-detection", "tool-use"]

# Keep install requirements compatible with other Python packages. `uv.lock`
# records the exact environment used by this repository: scikit-learn minor
# versions can change IsolationForest and KMeans output, so contributors should
# run through uv rather than resolving these ranges independently.
dependencies = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "jsonschema>=4.18,<5",
    "pydantic>=2.12,<3",
    # The Analyst runs by default in `run-all` and `demo`, so its client is a
    # base dependency rather than an extra. `--no-analyst` skips the stage but
    # does not change what gets installed.
    "litellm>=1.55,<2",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
insight-agent = "insight_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/insight_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID252"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
