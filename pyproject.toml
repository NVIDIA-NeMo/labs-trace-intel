[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "insight-agent"
version = "0.1.0rc1"
description = "Insights Analyst trace-evidence processing with a canonical JSONL trace contract"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "third_party/licenses.jsonl",
    "third_party/tau-bench-LICENSE.txt",
]
authors = [{ name = "Insight Agent contributors" }]
keywords = ["agent-traces", "evaluation", "anomaly-detection", "tool-use"]

# Keep install requirements compatible with other Python packages. `uv.lock`
# records the exact environment used by this repository: scikit-learn minor
# versions can change IsolationForest and KMeans output, so contributors should
# run through uv rather than resolving these ranges independently.
dependencies = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "jsonschema>=4.18,<5",
    "pydantic>=2.12,<3",
    "pydantic-settings[yaml]>=2.12,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6,<7",
    # The Analyst can run from the config-driven command and runs by default in
    # `demo`, so its client is a base dependency rather than an extra. Disabling
    # the stage does not change what gets installed.
    "litellm>=1.55,<2",
    "nooa>=0.0.10,<0.1",
]

[project.urls]
Repository = "https://github.com/NVIDIA/nemo-platform-insights-preview"

[project.optional-dependencies]
# Source adapters only. Filesystem users do not install or import provider SDKs.
langsmith = ["langsmith>=0.12,<0.13"]
mlflow = ["mlflow-skinny>=3.6,<4"]

[dependency-groups]
# Exercise the optional source adapters in the standard contributor and CI test environment without
# making them runtime dependencies for users of the canonical filesystem format.
dev = [
    "langsmith>=0.12,<0.13",
    "mlflow-skinny>=3.6,<4",
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.80",
]

[project.scripts]
insight-agent = "insight_agent.cli.main:main"

[tool.uv]
managed = true
# mlflow-skinny currently reaches databricks-sdk, which caps protobuf below 7.
# Protobuf 7.35 contains the complete ParseDict recursion-depth fix.
override-dependencies = ["protobuf>=7.35,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/insight_agent"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/pyproject.toml",
    "/src/insight_agent",
    "/third_party",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID252", "ANN"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
