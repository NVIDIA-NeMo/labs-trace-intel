[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trace-ingest"
version = "0.1.0"
description = "Canonical agent trace models and provider loaders"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dynamic = ["license-files"]
dependencies = ["httpx>=0.28,<1", "pydantic>=2.12,<3"]

[project.optional-dependencies]
langsmith = ["langsmith>=0.12,<0.13"]
mlflow = ["mlflow-skinny>=3.6,<4"]
langfuse = ["langfuse>=3.15,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/trace_ingest"]

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"
