# Trace Analyst: LangSmith example configuration
# Update the source settings below and configure inference credentials in .env.
# Set LANGSMITH_API_KEY in .env.
# Run from the repository root:
# uv sync --locked --extra langsmith
# uv run --no-sync insight-agent --config examples/trace-analyst-config-langsmith.yaml

trace:
  max_traces: 100
  langsmith:
    project: my-agent
    api_url: https://api.smith.langchain.com
    # start_time: 2026-09-01T00:00:00Z
    # filter: 'eq(status, "error")'
    # tree_filter: 'eq(run_type, "tool")'

  # For a native export, comment out langsmith above and enable this instead.
  # langsmith_trace_export_file:
  #   path: exports/langsmith

evidence_streams:
  anomaly_and_patterns: {}
  tool_issues: {}
