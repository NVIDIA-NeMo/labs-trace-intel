# Trace Analyst: LangSmith source settings
# Replace the trace block in trace-analyst-config.yaml with this block.
# Keep its evidence_streams and other shared settings. Set LANGSMITH_API_KEY
# in .env and install the client with: uv sync --locked --extra langsmith

trace:
  max_traces: 100
  langsmith:
    project: my-agent
    api_url: https://api.smith.langchain.com
    # start_time: 2026-09-01T00:00:00Z
    # filter: 'eq(status, "error")'
    # tree_filter: 'eq(run_type, "tool")'

  # For a native export, comment out langsmith above and enable this instead.
  # langsmith_trace_export_file:
  #   path: exports/langsmith
