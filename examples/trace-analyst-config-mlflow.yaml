# Trace Analyst: MLflow example configuration
# Update the source settings below and configure inference credentials in .env.
# If needed, set MLFLOW_TRACKING_USERNAME and MLFLOW_TRACKING_PASSWORD,
# or MLFLOW_TRACKING_TOKEN, in .env.
# Run from the repository root:
# uv sync --locked --extra mlflow
# uv run --no-sync insight-agent --config examples/trace-analyst-config-mlflow.yaml

trace:
  max_traces: 100
  mlflow_experiment:
    experiment: my-agent
    tracking_uri: https://mlflow.example.com
    # filter: "trace.status = 'ERROR'"

  # For a native export, comment out mlflow_experiment above and enable this instead.
  # mlflow_export:
  #   path: exports/mlflow-traces.json

evidence_streams:
  anomaly_and_patterns: {}
  tool_issues: {}
