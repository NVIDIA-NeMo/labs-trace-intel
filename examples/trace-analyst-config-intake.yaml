# Trace Analyst: NeMo Platform Intake example configuration
# Update the source settings below and configure inference credentials in .env.
# For authenticated deployments, set NMP_ACCESS_TOKEN in .env.
# Run from the repository root:
# uv sync --locked
# uv run --no-sync insight-agent --config examples/trace-analyst-config-intake.yaml

trace:
  max_traces: 100
  intake:
    base_url: https://platform.example.com
    workspace: my-workspace
    # page_size: 100
    # timeout_seconds: 30.0
    query:
      # Both bounds are required. Select a UTC window containing your traces.
      started_at_gte: 2026-09-01T00:00:00Z
      started_at_lte: 2026-09-02T00:00:00Z
      # agent_name: my-agent
      # evaluation_name: my-evaluation
      # test_case_name: my-test-case
      # session_id: my-session
      # status: error  # success, error, cancelled, or unknown.
      # max_traces: 100  # trace.max_traces takes precedence when set.
      # sort: started_at  # Or -started_at for newest first.

evidence_streams:
  anomaly_and_patterns: {}
  tool_issues: {}
