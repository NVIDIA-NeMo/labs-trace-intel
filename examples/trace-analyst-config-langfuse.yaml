# Trace Analyst: Langfuse v3 example configuration
# Update the source settings below and configure inference credentials in .env.
# Set LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY in .env.
# The key pair identifies the project.
# Run from the repository root:
# uv sync --locked --extra langfuse
# uv run --no-sync insight-agent --config examples/trace-analyst-config-langfuse.yaml

trace:
  max_traces: 100
  langfuse:
    base_url: https://langfuse.example.com
    # Both bounds are required. Select a UTC window containing your traces.
    from_timestamp: 2026-09-01T00:00:00Z
    to_timestamp: 2026-09-02T00:00:00Z
    # filter: >-
    #   [{"type":"string","column":"environment","operator":"=","value":"production"}]

  # For a native export, comment out langfuse above and enable this instead.
  # langfuse_export:
  #   path: exports/langfuse-traces.jsonl

evidence_streams:
  anomaly_and_patterns: {}
  tool_issues: {}
