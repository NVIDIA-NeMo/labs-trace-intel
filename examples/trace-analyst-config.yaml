# Trace Analyst example configuration
# Analyzes the bundled Tau Bench traces. Run from the repository root:
# uv run insight-agent --config examples/trace-analyst-config.yaml
# Optional settings below are commented out. Values illustrate usage; stream
# tuning values show the defaults. See docs/configuration.md for details.
# Keep credentials in .env. Relative paths resolve from the working directory.

trace:
  # Select exactly one source. Comment out filesystem before enabling another.
  filesystem:
    path: examples/tau_bench_traces.jsonl

  # Provider sources only; not supported with filesystem.
  # max_traces: 100

  # langsmith:
  #   project: my-agent
  #   api_url: https://api.smith.langchain.com
  #   start_time: 2026-09-01T00:00:00Z
  #   filter: 'eq(status, "error")'
  #   tree_filter: 'eq(run_type, "tool")'

  # langsmith_trace_export_file:
  #   path: exports/langsmith

  # Langfuse v3 requires both timezone-aware time bounds.
  # langfuse:
  #   base_url: https://langfuse.example.com
  #   from_timestamp: 2026-09-01T00:00:00Z
  #   to_timestamp: 2026-09-02T00:00:00Z
  #   filter: >-
  #     [{"type":"string","column":"environment","operator":"=","value":"production"}]

  # langfuse_export:
  #   path: exports/langfuse-traces.jsonl

  # mlflow_experiment:
  #   experiment: my-agent
  #   tracking_uri: https://mlflow.example.com
  #   filter: "trace.status = 'ERROR'"

  # mlflow_export:
  #   path: exports/mlflow-traces.json

  # intake:
  #   base_url: https://platform.example.com
  #   workspace: my-workspace
  #   page_size: 100
  #   timeout_seconds: 30.0
  #   query:
  #     started_at_gte: 2026-09-01T00:00:00Z
  #     started_at_lte: 2026-09-02T00:00:00Z
  #     agent_name: my-agent
  #     evaluation_name: my-evaluation
  #     test_case_name: my-test-case
  #     session_id: my-session
  #     status: error  # success, error, cancelled, or unknown.
  #     max_traces: 100  # trace.max_traces takes precedence when set.
  #     sort: started_at  # Or -started_at for newest first.

output_path: insights.yml

evidence_streams:
  # {} enables a stream with defaults. Remove {} before uncommenting its
  # nested settings. Omit a stream to disable it; at least one is required.
  anomaly_and_patterns: {}
    # contamination: 0.02
    # input_scaling: none  # Or robust.
    # cluster_candidates: [2, 3, 4, 5, 6, 7, 8]
    # minimum_independent_traces: 3
    # feature_names: null  # All built-in features, or a list of feature names.

  tool_issues: {}
    # minimum_independent_cases: 3
    # retry_threshold: 3
    # include_audit_problems: false

  # Requires recorded evaluator_results in the traces.
  # eval_failure_patterns:
  #   max_tool_rounds: 50

  # Requires an existing, non-empty business-purpose document.
  # ethos_divergence:
  #   ethos_path: ./ethos.md

# Validate findings against the agent's local source code.
# code_base: ../my-agent

# Reconcile results with a previous JSON or YAML Insight collection.
# existing_insights: previous-insights.yml

# Optional inference overrides. Use a model and token limit your provider supports.
# model: openai/your-model-name
# max_tokens: 32768
# api_base: https://gateway.example.com/v1
